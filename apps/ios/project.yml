# Projet Xcode généré par XcodeGen : `brew install xcodegen && xcodegen generate` dans ce dossier.
name: Coach
options:
  bundleIdPrefix: com.guillaumesabin
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "${APPLE_TEAM_ID}"   # Team ID Apple Developer, fourni par la CI ou votre environnement
    CODE_SIGN_STYLE: Automatic
packages:
  CoachCore:
    path: CoachCore
targets:
  Coach:
    type: application
    platform: iOS
    sources:
      - path: Coach
    dependencies:
      - package: CoachCore
    entitlements:
      path: Coach/Resources/Coach.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: Coach/Resources/Info.plist
      properties:
        CFBundleDisplayName: Coach
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: "Coach lit vos séances, votre fréquence cardiaque, votre HRV, votre sommeil et votre VO₂max pour suivre votre charge d'entraînement et adapter votre planning."
        NSHealthUpdateUsageDescription: "Coach n'écrit aucune donnée dans Santé."
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.guillaumesabin.coach.sync]
        NSAppTransportSecurity:
          # L'API tourne en HTTP sur le réseau local pendant le développement.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guillaumesabin.coach
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
    scheme:
      # Les tests unitaires tournent en parallèle (clones de simulateur) ; les tests d'interface en série.
      testTargets:
        - name: CoachTests
          parallelizable: true
          randomExecutionOrder: true
        - name: CoachUITests
      gatherCoverageData: true
      coverageTargets: [Coach]

  # Tests unitaires de l'app (Swift Testing) : SyncEngine avec doublures, modèles SwiftData en mémoire, réglages.
  # Hébergés par l'app, qui détecte ce contexte (LaunchMode) et ne démarre ni HealthKit ni le réseau.
  CoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoachTests
    dependencies:
      - target: Coach
      - package: CoachCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guillaumesabin.coach.tests
        GENERATE_INFOPLIST_FILE: YES

  # Parcours de fumée XCUITest : navigation entre les trois onglets, détail, filtre, captures d'écran.
  CoachUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CoachUITests
    dependencies:
      - target: Coach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guillaumesabin.coach.uitests
        GENERATE_INFOPLIST_FILE: YES

# La logique pure (classification, formats, contrat API) est testée dans le paquet CoachCore (`swift test`),
# exécutable sans Xcode, y compris sur Windows et Linux.
