# CI : logique Swift sur Linux (rapide, gratuit), API TypeScript, puis app iOS complète sur macOS
# (compilation, lancement dans le simulateur, capture). Aucun compte Apple Developer requis pour le simulateur.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-core:
    name: CoachCore (Swift, Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Tests CoachCore
        working-directory: apps/ios/CoachCore
        run: swift test --parallel

  api:
    name: API (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Fumée API avec les échantillons
        working-directory: apps/api
        run: |
          cp .env.example .env
          sed -i 's/INGEST_API_KEY=change-me/INGEST_API_KEY=ci-key/' .env
          npx tsx src/import/cli.ts ../../_context/samples/export.xml
          npx tsx src/server.ts & sleep 3
          curl -sf http://localhost:3210/health
          curl -sf -X POST http://localhost:3210/ingest/health-auto-export -H "x-api-key: ci-key" -H "content-type: application/json" --data-binary @../../_context/samples/hae-sample.json
          curl -sf -X POST http://localhost:3210/ingest/app -H "x-api-key: ci-key" -H "content-type: application/json" --data-binary @../../_context/samples/ios-app-sample.json
          curl -sf http://localhost:3210/stats

  ios:
    name: App iOS (macOS, simulateur)
    runs-on: macos-15
    needs: swift-core
    timeout-minutes: 40
    env:
      SCHEME: Coach
    steps:
      - uses: actions/checkout@v4

      # On garde le Xcode par défaut du runner : c'est le seul dont la plateforme iOS Simulator est installée.
      - name: Xcode et runtimes du runner
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available | grep -i ios || true

      - name: Installer XcodeGen et xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Générer le projet
        working-directory: apps/ios
        run: xcodegen generate

      - name: Compiler pour le simulateur
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Coach.xcodeproj -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            | tee build.log | xcbeautify --renderer github-actions || (grep -E "error:" build.log | sort -u | head -60; exit 1)
        env:
          NSUnbufferedIO: "YES"

      - name: Lancer dans un simulateur iPhone et capturer
        working-directory: apps/ios
        run: |
          # Un iPhone disponible pour le runtime iOS livré avec ce Xcode (pas de nom d'appareil codé en dur)
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[dev for rt,devs in d.items() if "iOS" in rt for dev in devs if dev["name"].startswith("iPhone")]
          c.sort(key=lambda x:x["name"]); print(c[-1]["udid"])')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/Build/Products -name "Coach.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.guillaume.coach
          sleep 8
          mkdir -p screenshots
          xcrun simctl io "$UDID" screenshot screenshots/01-seances.png
          # Les autres onglets nécessitent des tests XCUITest pour être pilotés ; à venir.

      - name: Publier captures et journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: |
            apps/ios/screenshots
            apps/ios/build.log
          if-no-files-found: warn
